[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "overlord-worldsim"
version = "0.1.0"
description = "Deterministic rules foundation for a long-running dark-fantasy RPG world simulator."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "Proprietary" }
authors = [
  { name = "Overlord WorldSim maintainers" },
]
dependencies = []

[project.optional-dependencies]
dev = [
  "hypothesis>=6.138,<7",
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[project.scripts]
overlord-worldsim = "overlord_worldsim.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/overlord_worldsim"]

[tool.pytest.ini_options]
addopts = [
  "--strict-config",
  "--strict-markers",
]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["overlord_worldsim"]

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests"]
warn_unreachable = true
pretty = true
